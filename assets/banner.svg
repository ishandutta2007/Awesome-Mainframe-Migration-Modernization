<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Accent Gradient for Highlights -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Card Background Glassmorphism -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Dynamic Animated Elements */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .pulse-circle { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
    .flow-path { stroke-dasharray: 20 10; animation: flowLine 6s linear infinite; }
    .floating-card-1 { animation: floatCard 5s ease-in-out infinite; }
    .floating-card-2 { animation: floatCard 6s ease-in-out infinite 1s; }
    .spinner { animation: rotateRing 20s linear infinite; transform-origin: 850px 170px; }
    
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; fill: #cbd5e1; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; fill: #38bdf8; font-size: 12px; }
  </style>

  <!-- Background -->
  <rect width="1000" height="340" rx="16" fill="url(#bg-gradient)" />

  <!-- Background Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1000" height="340" fill="url(#grid)" />
  </g>

  <!-- Animated Dynamic Background Accents -->
  <circle cx="850" cy="170" r="120" fill="none" stroke="url(#accent-grad)" stroke-width="2" opacity="0.4" class="spinner" stroke-dasharray="40 20 10 30" />
  <circle cx="850" cy="170" r="160" fill="#38bdf8" opacity="0.05" class="pulse-circle" />

  <!-- Data Flow Animated Lines (Mainframe to Cloud Flow) -->
  <path d="M 500 260 C 650 260, 680 140, 850 170" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6" class="flow-path" filter="url(#glow-cyan)" />
  <path d="M 450 290 C 600 290, 720 200, 850 170" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.5" class="flow-path" filter="url(#glow-purple)" />

  <!-- Visual Node Cards in Background Right -->
  <g class="floating-card-1">
    <rect x="750" y="60" width="160" height="50" rx="10" fill="url(#card-grad)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="770" y="90" class="badge-text">⚡ COBOL ➔ Java</text>
  </g>
  <g class="floating-card-2">
    <rect x="780" y="230" width="170" height="50" rx="10" fill="url(#card-grad)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="800" y="260" class="badge-text">☁️ Cloud Rehosting</text>
  </g>

  <!-- Foreground Main Banner Header & Text (Clear Foreground Layer) -->
  <g transform="translate(60, 0)">
    <!-- Top Pill / Category Badge -->
    <rect x="0" y="55" width="280" height="32" rx="16" fill="rgba(99, 102, 241, 0.3)" stroke="#818cf8" stroke-width="1.5" />
    <text x="16" y="76" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#e0e7ff" letter-spacing="1">
      🚀 AWESOME MAINFRAME ECOSYSTEM
    </text>

    <!-- Main Title -->
    <text x="0" y="145" class="title-text" font-size="36" filter="url(#glow-cyan)">
      Mainframe Migration &amp;
    </text>
    <text x="0" y="190" class="title-text" font-size="36" fill="url(#accent-grad)">
      Modernization Guide 2026
    </text>

    <!-- Subtitle -->
    <text x="0" y="235" class="subtitle-text" font-size="16">
      Curated Commercial Platforms • Open-Source Compilers • AI Refactoring • Cloud Emulators
    </text>

    <!-- Stat Pills Line -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="130" height="30" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" />
      <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">🏢 <tspan fill="#ffffff" font-weight="600">9 Enterprise</tspan> SaaS</text>

      <rect x="142" y="0" width="155" height="30" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" />
      <text x="154" y="20" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">💻 <tspan fill="#ffffff" font-weight="600">15 Open-Source</tspan> Repos</text>

      <rect x="309" y="0" width="150" height="30" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" />
      <text x="321" y="20" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">📊 <tspan fill="#ffffff" font-weight="600">$8.4B Sector</tspan> Market</text>
    </g>
  </g>
</svg>
